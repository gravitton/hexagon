name: Test

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    strategy:
      matrix:
        go:
          - '1.27'
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Install tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: staticcheck ./...

      - name: Fused multiply-add
        if: matrix.os == 'ubuntu-latest'
        run: |
          for t in "arm64 v1" "amd64 v3"; do set -- $t; GOARCH=$1 GOAMD64=$2 go test -c -o /dev/null -gcflags=-S . 2>&1 | awk '/ STEXT /{fn=$1} /[ \t](FN?M(ADD|SUB)[DS]|VFN?M(ADD|SUB)[0-9]+S[DS])[ \t]/ && fn ~ /hexagon/ && fn !~ /\.(Test|Benchmark|Example|Fuzz)/ && !/_test\.go/ {match($0, /[a-z_]+\.go:[0-9]+/); print substr($0, RSTART, RLENGTH)}'; done | sort -u | while IFS=: read -r file line; do printf '%s: %s\n' "$file" "$(sed -n "${line}p" "$file" | sed 's/^[[:space:]]*//')"; done | LC_ALL=C sort -u > "$RUNNER_TEMP/fused.txt"
          diff -u .github/fused.txt "$RUNNER_TEMP/fused.txt"

      - name: Security
        run: govulncheck ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race ./...

      - name: Coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
